[build]
  command = "pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  PNPM_FLAGS = "--no-frozen-lockfile"

[functions]
  node_bundler = "esbuild"
  included_files = ["drizzle/**", "shared/**"]

# إصلاح مسارات التوجيه وإزالة التكرار
[[redirects]]
  from = "/api/trpc/*"
  to = "/.netlify/functions/api/trpc/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/api/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/oauth/*"
  to = "/.netlify/functions/api/oauth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/madar-storage/*"
  to = "/.netlify/functions/api/madar-storage/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
