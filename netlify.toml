[build]
  command = "pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  PNPM_FLAGS = "--no-frozen-lockfile"
  # متغيرات البيئة الخاصة بقاعدة البيانات والمفاتيح
